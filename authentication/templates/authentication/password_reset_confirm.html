<h2>Définir un nouveau mot de passe</h2>

{% if validlink %}
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Réinitialiser mon mot de passe
        </button>
    </form>
{% else %}
    <p>Ce lien est invalide ou a expiré.</p>
{% endif %}
